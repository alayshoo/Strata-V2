name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.2"
      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own key so updates install over each other (see README).
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.STRATA_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/strata.jks"
          echo "STRATA_KEYSTORE=$RUNNER_TEMP/strata.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          STRATA_KEYSTORE_PASSWORD: ${{ secrets.STRATA_KEYSTORE_PASSWORD }}
          STRATA_KEY_ALIAS: ${{ secrets.STRATA_KEY_ALIAS }}
          STRATA_KEY_PASSWORD: ${{ secrets.STRATA_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: strata-apk
          path: app/build/outputs/apk/release/app-release.apk
