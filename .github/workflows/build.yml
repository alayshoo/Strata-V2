name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.STRATA_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.2"
      - uses: gradle/actions/setup-gradle@v4

      # Sign with your own key so every build installs over the previous one (see README).
      - name: Decode signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/strata.jks"
          echo "STRATA_KEYSTORE=$RUNNER_TEMP/strata.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          STRATA_KEYSTORE_PASSWORD: ${{ secrets.STRATA_KEYSTORE_PASSWORD }}
          STRATA_KEY_ALIAS: ${{ secrets.STRATA_KEY_ALIAS }}
          STRATA_KEY_PASSWORD: ${{ secrets.STRATA_KEY_PASSWORD }}
          STRATA_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: strata-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Builds of main signed with your key are published as a release, easy to download on the phone.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.KEYSTORE_B64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Strata build ${{ github.run_number }}
          body: Built from ${{ github.sha }}.
          files: app/build/outputs/apk/release/app-release.apk
